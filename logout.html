<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logout - Sportify Community</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="logout-hero-bg">
    <header class="top-navbar">
      <div class="brand-header" style="margin-bottom: 0;">
        <i class="fa-solid fa-person-running" style="font-size: 26px; color: #f59e0b;"></i>
        <span style="font-size: 16px;">Sportify Community</span>
      </div>
      <div class="user-pill">
        <i class="fa-solid fa-circle-user" style="color: #5b469c; font-size: 18px;"></i>
        <span>Irdina</span>
      </div>
    </header>

    <div class="logout-modal-container">
      <div class="logout-modal">
        <div class="check-circle">
          <i class="fa-solid fa-check"></i>
        </div>
        <h3 style="margin-bottom: 20px; font-size: 18px;">Are you sure you want to logout?</h3>

        <div style="display: flex; gap: 12px;">
          <a href="categories.html" class="btn-secondary">Cancel</a>
          <a href="login.html" class="btn-primary">Logout</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
