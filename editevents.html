<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Sports Event - Sportify Community</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-solid fa-person-running" style="color: #f59e0b; font-size: 24px;"></i>
        <span>Sportify<br>Community</span>
      </div>
      <a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="events.html" class="active"><i class="fa-solid fa-calendar-days"></i> Manage Events</a>
      <a href="categories.html"><i class="fa-solid fa-layer-group"></i> Manage Categories</a>
      <a href="registrations.html"><i class="fa-solid fa-clipboard-list"></i> Manage Registrations</a>
      <a href="logout.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h2>Edit Sports Event</h2>
      </div>

      <div class="card-table" style="max-width: 580px;">
        <form action="events.html" method="get">
          <!-- Hidden ID field ready for Servlet/JavaBean update later -->
          <input type="hidden" name="eventId" value="1">

          <div class="form-group">
            <label for="eventName">Event Name</label>
            <input type="text" id="eventName" name="eventName" value="Community Football League" required>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" required>
              <option value="Football" selected>Football</option>
              <option value="Badminton">Badminton</option>
              <option value="Futsal">Futsal</option>
              <option value="Volleyball">Volleyball</option>
            </select>
          </div>

          <div class="form-group">
            <label for="eventDate">Date</label>
            <input type="date" id="eventDate" name="eventDate" value="2026-11-16" required>
          </div>

          <div class="form-group">
            <label for="venue">Venue</label>
            <input type="text" id="venue" name="venue" value="Sports Hall" required>
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" required>Join our community football league!</textarea>
          </div>

          <div class="form-group">
            <label for="maxParticipants">Max Participants</label>
            <input type="number" id="maxParticipants" name="maxParticipants" value="32" required>
          </div>

          <div style="display: flex; gap: 12px; margin-top: 20px;">
            <a href="events.html" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">Update Event</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
