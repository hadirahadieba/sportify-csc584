<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Sportify Community</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <i class="fa-solid fa-person-running" style="font-size: 32px; color: #f59e0b;"></i>
        <span>Sportify<br>Community</span>
      </div>

      <h2>Welcome Back!</h2>
      <p class="subtitle">Log in to your account</p>

      <form action="categories.html" method="get">
        <div class="input-icon-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" placeholder="Email Address" required>
        </div>

        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" placeholder="Password" required>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 20px;">
          <label style="display: flex; align-items: center; gap: 6px; color: #4b4869; cursor: pointer;">
            <input type="checkbox"> Remember Me
          </label>
          <a href="#" style="color: #5b469c; text-decoration: none; font-weight: 600;">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </div>
</body>
</html>
