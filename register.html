<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Sportify Community</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-header">
        <i class="fa-solid fa-person-running" style="font-size: 32px; color: #f59e0b;"></i>
        <span>Sportify<br>Community</span>
      </div>

      <h2>Create Your Account</h2>
      <p class="subtitle">Fill in your details to register</p>

      <form action="login.html" method="get" onsubmit="return validateRegistration()">
        <div class="input-icon-wrapper">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="fullname" placeholder="Full Name" required>
        </div>

        <div class="input-icon-wrapper">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="email" placeholder="Email Address" required>
        </div>

        <div class="input-icon-wrapper">
          <i class="fa-solid fa-phone"></i>
          <input type="tel" id="phone" placeholder="Phone Number" required>
        </div>

        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="Password" required>
        </div>

        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        </div>

        <div id="errorBanner" class="error-banner" style="display: none;">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="errorText">Password must be at least 8 characters.</span>
        </div>

        <button type="submit" class="btn-primary">Register</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <script>
    function validateRegistration() {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const banner = document.getElementById('errorBanner');
      const errorText = document.getElementById('errorText');

      if (password.length < 8) {
        errorText.textContent = "Password must be at least 8 characters.";
        banner.style.display = "flex";
        return false;
      }
      if (password !== confirmPassword) {
        errorText.textContent = "Passwords do not match.";
        banner.style.display = "flex";
        return false;
      }
      banner.style.display = "none";
      alert("Registration successful! Redirecting to login...");
      return true;
    }
  </script>
</body>
</html>
