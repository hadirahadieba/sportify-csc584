<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile - Sportify Community</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-solid fa-person-running" style="color: #f59e0b; font-size: 24px;"></i>
        <span>Sportify<br>Community</span>
      </div>
      <a href="user-dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
      <a href="explore-events.html"><i class="fa-solid fa-compass"></i> Explore Events</a>
      <a href="my-registrations.html"><i class="fa-solid fa-clipboard-check"></i> My Registrations</a>
      <a href="profile.html" class="active"><i class="fa-solid fa-user"></i> Profile</a>
      <a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h2>My Profile</h2>
      </div>

      <div class="card-table" style="max-width: 560px;">
        <form onsubmit="event.preventDefault(); alert('Storyboard demo: Profile updated!');">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" value="Irdina" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" value="irdina@sportify.com" readonly style="background-color: #f3f4f6; color: #6b7280;">
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" value="012-3456789" required>
          </div>
          <button type="submit" class="btn-primary" style="margin-top: 10px;">Save Changes</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
